<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="description" content="Cuenta regresiva de conciertos · Ruido de Fondo 3000">
<title>RUIDO DE FONDO 3000 · Cuenta regresiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <a class="brand" href="https://instagram.com/ruido.de.fondo.3000" target="_blank" rel="noopener">RUIDO DE FONDO <b>3000</b></a>
  <span class="clock" id="clock">--:--:--</span>
</header>

<!-- próximo evento: cuenta regresiva en vivo -->
<section class="hero">
  <div class="hero-kicker">FALTA PARA <span id="heroName">—</span></div>
  <div class="count" id="count">
    <div class="cell"><span id="cD">00</span><label>DÍAS</label></div>
    <div class="sep">:</div>
    <div class="cell"><span id="cH">00</span><label>HRS</label></div>
    <div class="sep">:</div>
    <div class="cell"><span id="cM">00</span><label>MIN</label></div>
    <div class="sep">:</div>
    <div class="cell"><span id="cS">00</span><label>SEG</label></div>
  </div>
  <button class="hero-card" id="heroCard" type="button">
    <img class="hero-poster" id="heroPoster" alt="">
    <div class="hero-info">
      <div class="hero-date" id="heroDate"></div>
      <div class="hero-title" id="heroTitle"></div>
      <div class="hero-venue" id="heroVenue"></div>
    </div>
    <span class="hero-go">→</span>
  </button>
</section>

<!-- calendario mensual -->
<section class="calwrap">
  <div class="cal-head">
    <button class="cal-nav" id="calPrev" type="button" aria-label="Mes anterior">‹</button>
    <h2 class="cal-title" id="calTitle"></h2>
    <button class="cal-nav" id="calNext" type="button" aria-label="Mes siguiente">›</button>
  </div>
  <div class="dow"><span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span></div>
  <div class="grid" id="grid"></div>
  <div class="cal-legend"><span class="dot"></span> día con fecha · tocá un día marcado</div>
</section>

<!-- agenda agrupada por mes -->
<main class="agenda" id="agenda"></main>

<footer class="foot">
  <p>RUIDO DE FONDO 3000 — música independiente, sin filtro.</p>
  <p class="dim">Fuente: Google Calendar · <span id="stamp">—</span></p>
  <a href="https://instagram.com/ruido.de.fondo.3000" target="_blank" rel="noopener">@ruido.de.fondo.3000 ↗</a>
</footer>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet-card" id="sheetCard" role="dialog" aria-modal="true">
    <button class="sheet-x" id="sheetX" type="button" aria-label="Cerrar">✕</button>
    <div class="sheet-grip"></div>
    <img class="sheet-poster" id="sheetPoster" alt="">
    <div class="sheet-when" id="sheetWhen"></div>
    <h2 class="sheet-title" id="sheetTitle"></h2>
    <p class="sheet-sub" id="sheetSub"></p>
    <div class="sheet-rows" id="sheetRows"></div>
    <p class="sheet-note" id="sheetNote"></p>
    <div class="sheet-links" id="sheetLinks"></div>
  </div>
</div>

<script src="data/events.js"></script>
<script src="app.js"></script>
</body>
</html>
