<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>RUIDO DE FONDO 3000 · Calendario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="https://instagram.com/ruido.de.fondo.3000" target="_blank" rel="noopener">
    <span class="brand-main">RUIDO<br>DE FONDO</span>
    <span class="brand-num">3000</span>
  </a>
  <div class="topbar-right">
    <span class="live-dot" id="liveDot"></span>
    <span class="live-txt" id="liveTxt">SYNC</span>
  </div>
</header>

<section class="hero">
  <div class="hero-kicker">AGENDA · LIMA · <span id="eventCount">00</span> FECHAS</div>
  <h1 class="hero-title">CALENDARIO</h1>
  <div class="hero-foot">
    <span id="heroNext">—</span>
    <span class="arrow">↓</span>
  </div>
  <div class="marquee" aria-hidden="true">
    <div class="marquee-track" id="marqueeTrack"></div>
  </div>
</section>

<nav class="filters" id="filters" aria-label="Filtros">
  <button class="chip is-on" data-f="all">TODO</button>
  <button class="chip" data-f="week">ESTA SEMANA</button>
  <button class="chip" data-f="free">GRATIS</button>
  <button class="chip" data-f="intl">INTERNACIONAL</button>
</nav>

<main class="stack" id="stack"></main>

<footer class="foot">
  <div class="foot-line"></div>
  <p>RUIDO DE FONDO 3000 — música independiente, sin filtro.</p>
  <p class="dim">Datos desde Google Calendar · actualizado <span id="stamp">—</span></p>
  <a class="ig" href="https://instagram.com/ruido.de.fondo.3000" target="_blank" rel="noopener">@ruido.de.fondo.3000 ↗</a>
</footer>

<!-- hoja de detalle -->
<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <article class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Detalle del evento">
    <div class="sheet-grip"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </article>
</div>

<script src="../../data/events.js"></script>
<script src="app.js"></script>
</body>
</html>
